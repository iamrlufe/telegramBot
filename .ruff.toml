# Настройки линтера. Проверяется тем же набором, что и в CI
# (.github/workflows/ci.yml): ошибки, из-за которых код не запустится.
#
# E501 (длина строки) выключен сознательно: в проекте много длинных
# SQL-запросов и строк с логами, перенос которых читаемости не добавит.
line-length = 120

[lint]
# E9/F63/F7/F82/F811 — то, из-за чего код не запустится.
# F401/F841/W292 добавлены после уборки сентября 2026: тогда накопилось
# 36 неиспользуемых импортов и 10 брошенных переменных — сами по себе
# безвредные, но читателя они сбивают («учётка достаётся зачем-то»), а
# растут молча. Сторож дешевле повторной уборки.
#
# Импорт, который выглядит лишним, но нужен как РЕЭКСПОРТ (другой модуль
# берёт имя из этого файла, а не из первоисточника), помечается
# `# noqa: F401` с объяснением — см. bot/exchange_bot.py, bot/firewall_bot.py.
select = ["E9", "F63", "F7", "F82", "F811", "F401", "F841", "W292"]

[lint.per-file-ignores]
# Тесты сравнивают длинные строки логов дословно — переносить их нельзя.
"tests/*" = ["E501"]
